name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  client-tests:
    name: Client - Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install client dependencies
        run: |
          cd ILP/src/client/ilp.client
          npm install --legacy-peer-deps

      - name: Install test dependencies
        run: |
          cd ILP/tests/client
          npm install --legacy-peer-deps

      - name: Run client tests
        run: |
          cd ILP/tests/client
          npm test

      - name: Build client
        run: |
          cd ILP/src/client/ilp.client
          npm run build

  server-tests:
    name: Server - Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          cd ILP/src/server
          dotnet restore

      - name: Build server
        run: |
          cd ILP/src/server
          dotnet build --configuration Release --no-restore

      - name: Run server tests
        run: |
          cd ILP/tests/server
          dotnet test --configuration Release --verbosity normal

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [client-tests, server-tests]
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd ILP/src/client/ilp.client
          npm install --legacy-peer-deps

      - name: Build client
        run: |
          cd ILP/src/client/ilp.client
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ILP/src/client/ilp.client/dist
          publish_branch: gh-pages
          full_commit_message: 'Deploy: ${{ github.event.head_commit.message }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Deployment info
        run: |
          echo "✅ Deployment completed!"
          echo "🌐 URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
