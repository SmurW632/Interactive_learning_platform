name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'

jobs:
  # ==================== CI: КЛИЕНТ (Vue) ====================
  client-tests:
    name: Client - Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies (Client)
        run: |
          cd ILP/src/client/ilp.client
          npm install --legacy-peer-deps
      
      - name: Install test dependencies
        run: |
          cd ILP/tests/client
          npm install --legacy-peer-deps
      
      - name: Run client tests
        run: |
          cd ILP/tests/client
          npm test -- --run
        continue-on-error: false
      
      - name: Build client (production)
        run: |
          cd ILP/src/client/ilp.client
          npm run build
        continue-on-error: false

  # ==================== CI: СЕРВЕР (.NET) ====================
  server-tests:
    name: Server - Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: |
          cd ILP/src/server
          dotnet restore
      
      - name: Build server
        run: |
          cd ILP/src/server
          dotnet build --configuration Release --no-restore
      
      - name: Run server tests
        run: |
          cd ILP/tests/server
          dotnet test --configuration Release --verbosity normal
        continue-on-error: false

  # ==================== CI: PYTHON AI (опционально) ====================
  python-checks:
    name: Python AI - Checks
    runs-on: ubuntu-latest
    continue-on-error: true  # Не блокируем основной пайплайн
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd ILP/src/py_ai
          pip install -r requirements.txt || echo "No requirements file"
      
      - name: Check Python syntax
        run: |
          cd ILP/src/py_ai
          python -m py_compile main.py || echo "Syntax check failed but continuing"

  # ==================== CD: ДЕПЛОЙ (только main) ====================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [client-tests, server-tests]
    if: github.ref == 'refs/heads/main' && success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: |
          cd ILP/src/client/ilp.client
          npm install --legacy-peer-deps
      
      - name: Build client
        run: |
          cd ILP/src/client/ilp.client
          npm run build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ILP/src/client/ilp.client/dist
          publish_branch: gh-pages
          full_commit_message: 'Deploy: ${{ github.event.head_commit.message }}'
      
      - name: Deployment info
        run: |
          echo "✅ Deployment completed!"
          echo "🌐 URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
