name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  # ==================== ТЕСТЫ КЛИЕНТА ====================
  client-tests:
    name: Client - Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ILP/src/client/ilp.client/package-lock.json

      - name: Install client dependencies
        run: |
          cd ILP/src/client/ilp.client
          npm install --legacy-peer-deps

      - name: Install test dependencies
        run: |
          cd ILP/tests/client
          npm install --legacy-peer-deps

      - name: Run client tests
        run: |
          cd ILP/tests/client
          npm install --legacy-peer-deps
          npm test
        continue-on-error: false

      - name: Build client
        run: |
          cd ILP/src/client/ilp.client
          npm run build

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: ILP/src/client/ilp.client/dist
          retention-days: 7

  # ==================== ТЕСТЫ СЕРВЕРА ====================
  server-tests:
    name: Server - Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          cd ILP/src/server
          dotnet restore

      - name: Build server
        run: |
          cd ILP/src/server
          dotnet build --configuration Release --no-restore

      - name: Run server tests
        run: |
          cd ILP/tests/server
          dotnet test --configuration Release --verbosity normal
        continue-on-error: false

      - name: Publish server
        run: |
          cd ILP/src/server
          dotnet publish --configuration Release --output publish

      - name: Upload server build artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-publish
          path: ILP/src/server/publish
          retention-days: 7

  # ==================== ДЕПЛОЙ ФРОНТЕНДА ====================
  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: [client-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download client build artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          full_commit_message: 'Deploy frontend: ${{ github.event.head_commit.message }}'

      - name: Deployment info
        run: |
          echo "✅ Frontend deployed!"
          echo "🌐 URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

  # ==================== ДЕПЛОЙ БЭКЕНДА ====================
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [server-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          cd ILP/src/server
          dotnet restore

      - name: Publish server
        run: |
          cd ILP/src/server
          dotnet publish --configuration Release --output publish

      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

      - name: Deployment info
        run: |
          echo "✅ Backend deployed!"
          echo "🌐 URL: https://ilp-backend-re98.onrender.com"
